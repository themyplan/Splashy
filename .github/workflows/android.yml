name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set NDK path
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - run: npm install

      - name: Init Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npm run tauri android init
          fi

      - name: Diagnostic - who needs openssl?
        continue-on-error: true
        run: cargo tree --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android -i openssl-sys
      - name: Build APK
        run: npm run tauri android build -- --debug --apk true --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: splashy-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Commit generated Android project
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f src-tauri/gen/android
          git diff --cached --quiet || (git commit -m "Add Android project" && git push)
